services:
  zookeeper:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/zookeeper:3.8
    container_name: dubbo-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=0.0.0.0:2888:3888;2181
    healthcheck:
      # Zookeeper 3.8 默认仅开放 srvr 四字命令
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q Mode"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  dubbo-provider:
    build:
      context: ./springboot-dubbo
      dockerfile: Dockerfile
      args:
        SERVICE: provider
    container_name: dubbo-provider
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9011:9011"
      - "20880:20880"

  dubbo-consumer:
    build:
      context: ./springboot-dubbo
      dockerfile: Dockerfile
      args:
        SERVICE: consumer
    container_name: dubbo-consumer
    depends_on:
      zookeeper:
        condition: service_healthy
      dubbo-provider:
        condition: service_started
    ports:
      - "9021:9021"
