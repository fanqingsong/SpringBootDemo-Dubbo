services:
  zookeeper:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/zookeeper:3.8
    container_name: dubbo-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=0.0.0.0:2888:3888;2181
    healthcheck:
      # Zookeeper 3.8 默认仅开放 srvr 四字命令
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q Mode"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  dubbo-provider:
    build:
      context: .
      dockerfile: dubbo-provider/Dockerfile
    container_name: dubbo-provider
    depends_on:
      zookeeper:
        condition: service_healthy
      dubbo-monitor:
        condition: service_started
    ports:
      - "9011:9011"
      - "20880:20880"

  dubbo-consumer:
    build:
      context: .
      dockerfile: dubbo-consumer/Dockerfile
    container_name: dubbo-consumer
    depends_on:
      zookeeper:
        condition: service_healthy
      dubbo-monitor:
        condition: service_started
      dubbo-provider:
        condition: service_started
    ports:
      - "9021:9021"

  dubbo-monitor:
    build:
      context: .
      dockerfile: dubbo-monitor/Dockerfile
    container_name: dubbo-monitor
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "38081:8080"
      - "7070:7070"
    volumes:
      - ./dubbo-monitor/config/dubbo.properties:/opt/dubbo-monitor-simple/conf/dubbo.properties:ro
      - dubbo-monitor-data:/data/monitor

  dubbo-admin:
    # 华为 SWR 同步镜像；latest 未同步，固定 0.6.0（兼容 Dubbo 2.6.x）
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/apache/dubbo-admin:0.6.0
    container_name: dubbo-admin
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "38080:38080"
    volumes:
      - ./dubbo-admin/config:/config

volumes:
  dubbo-monitor-data:
